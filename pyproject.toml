[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wealth-os"
version = "0.1.0"
description = "Cash-aware, event-driven multi-asset allocation research framework"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
vectorbt = ["vectorbt>=0.26"]
research = ["wealth-os[vectorbt]", "cvxpy>=1.4"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
research = ["vectorbt>=0.26", "cvxpy>=1.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/wealth_os"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
known-first-party = ["wealth_os"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "vectorbt.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cvxpy.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
